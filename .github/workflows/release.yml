name: Release

# Cut a release by pushing a tag:
#   git tag -a v0.1.0 -m "first release" && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # to create the release and upload the archives

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # goreleaser reads the tag history for the changelog

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
